       npx @bam.tech/react-native-make set-icon --path ./assets/icon/paxa-icon.png
     or use https://icon.kitchen / Android Studio Image Asset for adaptive icons.
     Android adaptive: foreground = the mark on transparent, background = #16150f. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="224" fill="#16150f"/>
  <g transform="translate(512,512) scale(9) translate(-32,-32) skewX(-15)" fill="#c2f23f">
    <rect x="28" y="12" width="29" height="13.5" rx="6.5"/>
    <rect x="28" y="18" width="13.5" height="28" rx="6.5"/>
    <rect x="12" y="38.5" width="29" height="13.5" rx="6.5"/>
  </g>
</svg>
