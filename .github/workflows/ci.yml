name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo. Overrides the default
# write-all token scope.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Build shared first: server's `tsc --noEmit` resolves `@splitr/shared`
      # via its CJS `main` field, which needs `dist/` to exist.
      - name: Build shared
        run: npm -w @splitr/shared run build

      - name: Typecheck shared
        run: npm -w shared run typecheck

      - name: Typecheck server
        run: npm -w server run typecheck

      - name: Typecheck mobile
        run: npm -w mobile run typecheck

      - name: Build server
        run: npm -w server run build

      - name: Lint mobile
        run: npm -w mobile run lint

      - name: Domain logic test (split/balance engine)
        run: npm -w mobile run test:logic

      # Catch new vulnerable transitive deps before they enter main.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
