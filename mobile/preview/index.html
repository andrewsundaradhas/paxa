<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f2ec">
<title>paxa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * paxa — premium payment-app build (SplitR Premium.dc.html).
   * Warm canvas, dark wallet hero cards, soft depth, Sora display type,
   * floating blurred tab bar, one electric lime accent. Same engine as the
   * React Native app; this is the self-contained mobile web preview.
   */
  :root{
    --ink:#16150f; --canvas:#f4f2ec; --lime:#c2f23f; --limeDark:#3f6b00;
    --m1:#8a887d; --m2:#a3a196; --m3:#6f6d63; --line:rgba(20,20,15,0.06);
    --pink:#fa00ff; --cyan:#02bbff; --khaki:#e7e3bf;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(170deg,#efece4 0%,#e8e5dc 60%,#e3e0d6 100%);
    display:flex;align-items:stretch;justify-content:center;
  }
  #app{
    position:relative;width:100%;max-width:440px;min-height:100dvh;background:var(--canvas);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .scroll::-webkit-scrollbar{width:0;height:0;}
  .sora{font-family:'Space Grotesk','Hanken Grotesk',sans-serif;}
  .row{display:flex;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .center{display:flex;align-items:center;justify-content:center;}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 16px rgba(20,20,15,0.05);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  @keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0;}12%{opacity:1;}100%{transform:translateY(380px) rotate(220deg);opacity:0;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(function(){
  var C={ink:'#16150f',canvas:'#f4f2ec',lime:'#c2f23f',limeDark:'#3f6b00',m1:'#8a887d',m2:'#a3a196',m3:'#6f6d63',
    line:'rgba(20,20,15,0.06)',pink:'#fa00ff',cyan:'#02bbff',khaki:'#e7e3bf'};

  // paxa twin-bar mark (recolors per surface)
  function paxa(size,color){var s=size||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 64 64" fill="'+(color||C.ink)+'"><g transform="skewX(-15)"><rect x="28" y="12" width="29" height="13.5" rx="6.5"/><rect x="28" y="18" width="13.5" height="28" rx="6.5"/><rect x="12" y="38.5" width="29" height="13.5" rx="6.5"/></g></svg>';}

  // ---- data ----
  var M={you:{id:'you',name:'You',initials:'You',color:C.pink,vpa:'riya@okhdfc'},aarav:{id:'aarav',name:'Aarav',initials:'Aa',color:C.cyan,vpa:'aarav@oksbi'},
    priya:{id:'priya',name:'Priya',initials:'Pr',color:C.lime,vpa:'priya@okaxis'},rohan:{id:'rohan',name:'Rohan',initials:'Ro',color:C.khaki,vpa:'rohan@okhdfc'},
    meera:{id:'meera',name:'Meera',initials:'Me',color:C.pink,vpa:'meera@okicici'}};
  var TINT={'#fa00ff':'#f6e6f3','#02bbff':'#e3eef5','#c2f23f':'#edf7cf','#adff02':'#edf7cf','#e7e3bf':'#f0ecdd'};
  var CATTINT={Food:'#edf7cf',Travel:'#e3eef5',Stay:'#f0ecdd',Fun:'#f6e6f3',Rent:'#e3eef5',Bills:'#f0ecdd'};
  function seed(){return [
    {id:'goa',name:'Goa Trip 2026',fill:C.khaki,members:['you','aarav','priya','rohan'],expenses:[
      {id:'goa-e1',title:'Beach shack lunch',cat:'Food',amount:2400,paidBy:'aarav',date:'Today',involved:['you','aarav','priya','rohan']},
      {id:'goa-e2',title:'Scooter rentals',cat:'Travel',amount:1600,paidBy:'you',date:'Yesterday',involved:['you','aarav','priya','rohan']},
      {id:'goa-e3',title:'Hotel — night 1',cat:'Stay',amount:6400,paidBy:'priya',date:'2 days ago',involved:['you','aarav','priya','rohan']},
      {id:'goa-e4',title:'Club night',cat:'Fun',amount:3000,paidBy:'rohan',date:'2 days ago',involved:['you','aarav','rohan']}]},
    {id:'flat',name:'Flat 4B',fill:C.cyan,members:['you','aarav','meera'],expenses:[
      {id:'flat-e1',title:'October rent',cat:'Rent',amount:45000,paidBy:'you',date:'Oct 1',involved:['you','aarav','meera']},
      {id:'flat-e2',title:'Wifi + electricity',cat:'Bills',amount:3600,paidBy:'meera',date:'Oct 3',involved:['you','aarav','meera']},
      {id:'flat-e3',title:'Groceries',cat:'Food',amount:2100,paidBy:'you',date:'Oct 5',involved:['you','aarav','meera']}]},
    {id:'din',name:'Friday Dinners',fill:C.pink,members:['you','priya','meera','rohan'],settledBase:true,expenses:[
      {id:'din-e1',title:'Sushi night',cat:'Food',amount:4800,paidBy:'you',date:'Last Fri',involved:['you','priya','meera','rohan']}]}
  ];}

  // ---- state ----
  var S={screen:'onboarding',groupId:'goa',tab:'balances',billId:'goa-e1',sheet:null,settleMethod:'upi',
    settleTarget:null,settledPairs:{},log:{},userColor:C.pink,groups:seed(),exp:null,grp:null,toast:null,reminded:{}};
  var CATBAR={Food:'#c2f23f',Travel:'#02bbff',Stay:'#e7e3bf',Fun:'#fa00ff',Rent:'#8aa0ff',Bills:'#f5b54a'};
  // paxa takes no fee — money moves peer-to-peer through the user's UPI app.
  function upiUrl(vpa,name,amount,note){return 'upi://pay?pa='+encodeURIComponent(vpa)+'&pn='+encodeURIComponent(name)+'&am='+amount.toFixed(2)+'&cu=INR&tn='+encodeURIComponent(note||'paxa settlement');}
  var toastTimer;
  function flash(msg){S.toast=msg;render();if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){S.toast=null;render();},2200);}

  // ---- logic ----
  function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN');}
  function group(id){id=id||S.groupId;return S.groups.find(function(g){return g.id===id;});}
  function tintOf(f){return TINT[f]||'#f0ecdd';}
  function pairwise(g){var map={};g.members.forEach(function(m){if(m!=='you')map[m]=0;});
    g.expenses.forEach(function(e){var sh=e.amount/e.involved.length;
      if(e.paidBy!=='you'&&e.involved.indexOf('you')>-1&&map[e.paidBy]!==undefined)map[e.paidBy]+=sh;
      if(e.paidBy==='you')e.involved.forEach(function(m){if(m!=='you'&&map[m]!==undefined)map[m]-=sh;});});return map;}
  function youOwe(g){var m=pairwise(g),t=0;Object.keys(m).forEach(function(id){if(m[id]>0&&!S.settledPairs[g.id+':'+id])t+=m[id];});return t;}
  function owed(g){var m=pairwise(g),t=0;Object.keys(m).forEach(function(id){if(m[id]<0)t+=-m[id];});return t;}
  function topCreditor(g){var m=pairwise(g),best=null,a=0;Object.keys(m).forEach(function(k){if(m[k]>a&&!S.settledPairs[g.id+':'+k]){a=m[k];best=k;}});return best?M[best]:M[g.members.find(function(x){return x!=='you';})];}
  function settled(g){if(g.settledBase&&!S.log[g.id])return true;return youOwe(g)<1&&owed(g)<1;}
  function invIds(e){return Object.keys(e.involved).filter(function(k){return e.involved[k];});}
  function splits(e){var amt=parseFloat(e.amount)||0,ids=invIds(e),out={};
    if(e.mode==='equal')ids.forEach(function(id){out[id]=ids.length?amt/ids.length:0;});
    else if(e.mode==='exact')ids.forEach(function(id){out[id]=parseFloat(e.vals[id])||0;});
    else if(e.mode==='percent')ids.forEach(function(id){out[id]=amt*(parseFloat(e.vals[id])||0)/100;});
    else if(e.mode==='shares'){var t=0;ids.forEach(function(id){t+=parseFloat(e.vals[id])||0;});ids.forEach(function(id){out[id]=t?amt*(parseFloat(e.vals[id])||0)/t:0;});}
    return out;}
  function valid(e){if(!e)return false;var amt=parseFloat(e.amount)||0,ids=invIds(e);
    if(!e.title.trim()||amt<=0||!ids.length)return false;if(e.mode==='equal'||e.mode==='shares')return true;
    var sp=splits(e),s=0;ids.forEach(function(id){s+=sp[id];});return Math.abs(s-amt)<1;}

  function insights(){
    var cat={},spend=0;
    S.groups.forEach(function(g){g.expenses.forEach(function(e){if(e.involved.indexOf('you')<0)return;var sh=e.amount/e.involved.length;spend+=sh;cat[e.cat]=(cat[e.cat]||0)+sh;});});
    var max=Math.max(1,...Object.values(cat));
    var cats=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a];}).map(function(n){return {name:n,color:CATBAR[n]||C.khaki,amount:fmt(cat[n]),pct:Math.round(cat[n]/(spend||1)*100)+'%',barW:Math.max(6,Math.round(cat[n]/max*100))};});
    var tv=[0.42,0.61,0.38,0.74,0.55,1.0],tl=['Jan','Feb','Mar','Apr','May','Jun'];
    var bars=tv.map(function(v,i){var last=i===tv.length-1;return {label:tl[i],h:Math.round(v*100),last:last,amount:last?fmt(spend):''};});
    return {total:fmt(spend),topCatName:cats[0]?cats[0].name:'—',topCatPct:cats[0]?cats[0].pct:'',categories:cats,trendBars:bars};
  }

  // ---- actions ----
  function openSheet(name,target){
    if(name==='addExpense'){var g=group();var inv={};g.members.forEach(function(m){inv[m]=true;});S.exp={title:'',amount:'',paidBy:'you',mode:'equal',involved:inv,vals:{}};}
    if(name==='createGroup')S.grp={name:'',color:C.cyan,members:{you:true}};
    if(name==='settle'){S.settleMethod='upi';S.settleTarget=target||null;}
    S.sheet=name;render();}
  function addExpense(){var e=S.exp,g=group();if(!valid(e))return;var amt=parseFloat(e.amount)||0;
    g.expenses.unshift({id:g.id+'-u'+Date.now(),title:e.title.trim(),cat:'Food',amount:amt,paidBy:e.paidBy,date:'Just now',involved:invIds(e)});
    Object.keys(S.settledPairs).forEach(function(k){if(k.indexOf(g.id+':')===0)delete S.settledPairs[k];});
    S.sheet=null;S.tab='expenses';render();}
  function createGroup(){var f=S.grp;var mids=Object.keys(f.members).filter(function(k){return f.members[k];});
    if(!f.name.trim()||mids.length<2)return;var id='grp'+Date.now();
    S.groups.push({id:id,name:f.name.trim(),fill:f.color,members:mids,expenses:[]});S.sheet=null;S.screen='group';S.groupId=id;S.tab='expenses';render();}
  function finishPay(){var g=group();var tid=S.settleTarget||topCreditor(g).id;var pw=pairwise(g);
    var amount=Math.max(0,pw[tid]||0);
    S.log[g.id]=(S.log[g.id]||[]).concat([{to:M[tid].name,amount:amount,method:S.settleMethod,date:'Just now'}]);
    S.settledPairs[g.id+':'+tid]=true;S.sheet=null;S.tab='history';render();}

  // ---- view helpers ----
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function avatar(m,size,opts){opts=opts||{};var s=size||40;var fs=Math.max(10,Math.round(s*0.3));
    return '<div class="center sora" style="width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+m.color+';font-weight:700;font-size:'+fs+'px;color:#16150f;'+(opts.ring?'outline:2px solid #16150f;outline-offset:2px;':'')+(opts.darkRing?'border:2px solid #16150f;':'')+(opts.overlap?'margin-left:-8px;':'')+(opts.shadow?'box-shadow:0 0 0 1px rgba(20,20,15,0.08);':'')+'">'+esc(m.initials)+'</div>';}
  function act(a){return 'data-act="'+a+'"';}
  function seg(active){return active?{bg:'#16150f',tx:'#fff',sh:'0 2px 8px rgba(20,20,15,0.2)'}:{bg:'transparent',tx:'#6f6d63',sh:'none'};}
  function backBtn(a){return '<div '+act(a)+' class="center" style="width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid '+C.line+';box-shadow:0 4px 12px rgba(20,20,15,0.05);cursor:pointer;"><svg width="9" height="15" viewBox="0 0 9 15"><path d="M7.5 1L1.5 7.5l6 6" stroke="#16150f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';}

  // ---- screens ----
  function onboarding(){
    return '<div class="scroll"><div style="min-height:100%;padding:14px 18px 26px;display:flex;flex-direction:column;animation:fade .4s;">'+
      '<div style="position:relative;border-radius:30px;background:#16150f;overflow:hidden;padding:26px 22px 30px;flex:1;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 50px rgba(20,20,15,0.22);">'+
        '<div style="position:absolute;top:-60px;right:-50px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(194,242,63,0.28),transparent 68%);"></div>'+
        '<div style="position:absolute;bottom:-40px;left:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(120,160,255,0.16),transparent 70%);"></div>'+
        '<div style="position:relative;">'+
          '<div class="between"><div class="row" style="align-items:center;gap:9px;">'+paxa(26,C.lime)+'<span class="sora" style="font-weight:700;font-size:22px;color:#fff;letter-spacing:-.02em;">paxa</span></div>'+
          '<div class="row" style="align-items:center;gap:7px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:6px 12px;"><div style="width:7px;height:7px;border-radius:50%;background:'+C.lime+';"></div><span style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.8);">UPI · Cards</span></div></div>'+
          '<div class="sora" style="font-weight:800;font-size:40px;line-height:1.04;letter-spacing:-.03em;color:#fff;margin-top:26px;">Split the bill.<br>Keep the <span style="color:'+C.lime+';">vibe.</span></div>'+
          '<div style="font-size:14.5px;color:rgba(255,255,255,0.62);font-weight:500;margin-top:14px;max-width:280px;">Add an expense, we do the math, everyone settles in two taps. Minus the awkward reminders.</div>'+
        '</div>'+
        '<div style="position:relative;margin-top:30px;border-radius:22px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);padding:18px;">'+
          '<div style="font-size:12px;font-weight:500;color:rgba(255,255,255,0.5);">Goa Trip · your balance</div>'+
          '<div class="sora" style="font-weight:800;font-size:34px;color:#fff;margin-top:3px;letter-spacing:-.02em;">- ₹2,000</div>'+
          '<div class="row" style="gap:0;margin-top:10px;"><div style="width:30px;height:30px;border-radius:50%;border:2px solid #16150f;background:'+C.pink+';"></div><div style="width:30px;height:30px;border-radius:50%;border:2px solid #16150f;background:'+C.cyan+';margin-left:-12px;"></div><div style="width:30px;height:30px;border-radius:50%;border:2px solid #16150f;background:'+C.lime+';margin-left:-12px;"></div><div style="width:30px;height:30px;border-radius:50%;border:2px solid #16150f;background:'+C.khaki+';margin-left:-12px;"></div></div>'+
        '</div>'+
      '</div>'+
      '<button '+act('start')+' class="sora" style="width:100%;background:'+C.lime+';border-radius:20px;padding:18px;font-weight:700;font-size:17px;color:#16150f;margin-top:16px;box-shadow:0 10px 24px rgba(194,242,63,0.4);">Get Started</button>'+
    '</div></div>';
  }

  function home(){
    var totOwe=0,totOwed=0;S.groups.forEach(function(g){totOwe+=youOwe(g);totOwed+=owed(g);});
    var net=totOwed-totOwe;var heroNet=(net>=0?'+':'- ')+fmt(Math.abs(net));var heroLbl=net>=0?'You’re up overall':'You owe overall';
    var qa=function(a,bg,svg,label){return '<div '+act(a)+' style="flex:1;background:#fff;border:1px solid '+C.line+';border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 6px 16px rgba(20,20,15,0.05);cursor:pointer;"><div class="center" style="width:42px;height:42px;border-radius:14px;background:'+bg+';">'+svg+'</div><span style="font-size:12px;font-weight:600;">'+label+'</span></div>';};
    var groups=S.groups.map(function(g){
      var nl='settled up',na='✓',nc=C.m2;
      if(!settled(g)){var o=youOwe(g),od=owed(g);if(o>od){nl='you owe';na=fmt(o-od);nc=C.ink;}else{nl='owed to you';na='+'+fmt(od-o);nc=C.limeDark;}}
      return '<div '+act('openGroup:'+g.id)+' class="card" style="display:flex;align-items:center;gap:14px;padding:13px 14px;cursor:pointer;">'+
        '<div class="center sora" style="width:50px;height:50px;border-radius:16px;background:'+tintOf(g.fill)+';font-weight:700;font-size:19px;flex-shrink:0;">'+esc(g.name.charAt(0))+'</div>'+
        '<div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:16px;">'+esc(g.name)+'</div><div style="font-size:12.5px;color:'+C.m1+';font-weight:500;margin-top:2px;">'+g.members.length+' people · '+g.expenses.length+' expenses</div></div>'+
        '<div style="text-align:right;"><div class="sora" style="font-weight:700;font-size:18px;color:'+nc+';letter-spacing:-.01em;">'+na+'</div><div style="font-size:11px;font-weight:600;color:'+C.m2+';margin-top:1px;">'+nl+'</div></div></div>';
    }).join('');
    return '<div class="scroll"><div style="padding:6px 18px 130px;animation:rise .4s;">'+
      '<div class="between" style="margin:6px 2px 18px;"><div><div style="font-size:13px;font-weight:500;color:'+C.m1+';">Good evening</div><div class="sora" style="font-weight:700;font-size:21px;letter-spacing:-.01em;">Riya Sharma</div></div>'+
      '<div '+act('goProfile')+' style="position:relative;cursor:pointer;"><div class="center sora" style="width:44px;height:44px;border-radius:50%;background:'+S.userColor+';font-weight:700;font-size:14px;color:#16150f;box-shadow:0 4px 12px rgba(20,20,15,0.12);">Ri</div><div style="position:absolute;top:0;right:0;width:11px;height:11px;border-radius:50%;background:'+C.lime+';border:2px solid '+C.canvas+';"></div></div></div>'+
      // hero balance card
      '<div style="position:relative;overflow:hidden;border-radius:28px;background:#16150f;padding:22px 20px;box-shadow:0 20px 40px rgba(20,20,15,0.18);">'+
        '<div style="position:absolute;top:-50px;right:-40px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(194,242,63,0.22),transparent 68%);"></div>'+
        '<div class="between" style="position:relative;"><div class="row" style="align-items:center;gap:7px;">'+paxa(15,C.lime)+'<span style="font-size:12.5px;font-weight:500;color:rgba(255,255,255,0.55);">Net balance · all groups</span></div>'+
        '<span style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.1);border-radius:999px;padding:4px 10px;">'+S.groups.length+' groups</span></div>'+
        '<div class="sora" style="position:relative;font-weight:800;font-size:42px;letter-spacing:-.03em;color:#fff;margin-top:8px;">'+heroNet+'</div>'+
        '<div class="row" style="position:relative;align-items:center;gap:6px;background:rgba(194,242,63,0.16);border-radius:999px;padding:5px 11px;margin-top:8px;width:fit-content;"><div style="width:6px;height:6px;border-radius:50%;background:'+C.lime+';"></div><span style="font-size:12px;font-weight:600;color:'+C.lime+';">'+heroLbl+'</span></div>'+
        '<div class="row" style="position:relative;gap:10px;margin-top:18px;">'+
          '<div style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:12px 14px;"><div style="font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.5);">You owe</div><div class="sora" style="font-weight:700;font-size:18px;color:#fff;margin-top:2px;">'+fmt(totOwe)+'</div></div>'+
          '<div style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:12px 14px;"><div style="font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.5);">You\'re owed</div><div class="sora" style="font-weight:700;font-size:18px;color:'+C.lime+';margin-top:2px;">+'+fmt(totOwed)+'</div></div>'+
        '</div>'+
      '</div>'+
      // quick actions
      '<div class="row" style="gap:10px;margin:18px 0 24px;">'+
        qa('qaAdd','#edf7cf','<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="#3f6b00" stroke-width="2.2" stroke-linecap="round"/></svg>','Add')+

  function updateAdd(){var e=S.exp;if(!e)return;var amt=parseFloat(e.amount)||0,ids=invIds(e),sp=splits(e);

  // ---- render + events ----
  function render(){
    var el=document.getElementById('app');var h='';
    if(S.screen==='onboarding')h=onboarding();
    else if(S.screen==='home')h=home();
    else if(S.screen==='group')h=groupDetail();
    else if(S.screen==='bill')h=bill();
    else if(S.screen==='activity')h=activity();
    else if(S.screen==='profile')h=profile();
    if(S.sheet==='addExpense')h+=sheetAdd();
    else if(S.sheet==='createGroup')h+=sheetCreate();
    else if(S.sheet==='settle')h+=sheetSettle();
    else if(S.sheet==='success')h+=sheetSuccess();
    el.innerHTML=h+(S.toast?toastHtml():'');
    if(S.sheet==='addExpense')updateAdd();
  }
  function toastHtml(){return '<div style="position:absolute;left:50%;transform:translateX(-50%);bottom:92px;z-index:70;display:flex;align-items:center;gap:9px;background:#16150f;border-radius:999px;padding:11px 18px;box-shadow:0 14px 30px rgba(20,20,15,0.32);animation:rise .3s;white-space:nowrap;"><div style="width:7px;height:7px;border-radius:50%;background:'+C.lime+';"></div><span style="font-size:13px;font-weight:600;color:#fff;">'+esc(S.toast)+'</span></div>';}

  document.getElementById('app').addEventListener('click',function(ev){
    var t=ev.target;while(t&&t!==this&&!t.getAttribute('data-act'))t=t.parentNode;
    if(!t||t===this)return;var a=t.getAttribute('data-act');if(!a||a==='noop')return;
    var i=a.indexOf(':');var name=i<0?a:a.slice(0,i);var arg=i<0?null:a.slice(i+1);
    switch(name){
      case 'start': S.screen='home';S.sheet=null;render();break;
      case 'goHome': S.screen='home';S.sheet=null;render();break;
      case 'goActivity': S.screen='activity';S.sheet=null;render();break;
      case 'goProfile': S.screen='profile';S.sheet=null;render();break;
      case 'openGroup': S.groupId=arg;S.tab='balances';S.screen='group';render();break;
      case 'openBill': S.billId=arg;S.screen='bill';render();break;
      case 'backGroup': S.screen='group';render();break;
      case 'tab': S.tab=arg;render();break;
      case 'openCreate': openSheet('createGroup');break;
      case 'qaAdd': S.groupId='goa';S.screen='group';S.tab='balances';openSheet('addExpense');break;
      case 'qaSettle': S.groupId='goa';S.tab='balances';S.screen='group';openSheet('settle',topCreditor(group('goa')).id);break;
      case 'qaRequest': flash('Payment requests sent via UPI');break;
      case 'remind': S.reminded[S.groupId+':'+arg]=true;flash('Reminder sent to '+(M[arg]?M[arg].name:'them'));break;
      case 'settle': openSheet('settle',arg);break;
      case 'tabAdd': if(S.screen==='group')openSheet('addExpense');else openSheet('createGroup');break;
      case 'closeSheet': S.sheet=null;render();break;
      case 'payer': S.exp.paidBy=arg;render();break;
      case 'mode': S.exp.mode=arg;render();break;
      case 'toggleInv': S.exp.involved[arg]=!S.exp.involved[arg];render();break;
      case 'addExpense': addExpense();break;
      case 'grpColor': S.grp.color=arg;render();break;
      case 'member': S.grp.members[arg]=!S.grp.members[arg];render();break;
      case 'createGroup': createGroup();break;
      case 'method': S.settleMethod=arg;render();break;
      case 'doPay': {
        if(S.settleMethod==='upi'){
          var dg=group();var dpw=pairwise(dg);var dtid=S.settleTarget||topCreditor(dg).id;var damt=Math.max(0,dpw[dtid]||0);
          // hand off to the user's UPI app (opens the chooser on a real phone)
          try{window.location.href=upiUrl(M[dtid].vpa,M[dtid].name,damt,dg.name+' settle');}catch(e){}
        }
        S.sheet='success';render();break;
      }
      case 'finishPay': finishPay();break;
      case 'userColor': S.userColor=arg;flash('Sticker color updated');break;
    }
  });
  document.getElementById('app').addEventListener('input',function(ev){
    var t=ev.target;var key=t.getAttribute('data-input');if(!key)return;
    if(key==='title'){S.exp.title=t.value;updateAdd();}
    else if(key==='amount'){var v=t.value.replace(/[^0-9.]/g,'');if(v!==t.value)t.value=v;S.exp.amount=v;updateAdd();}
    else if(key.indexOf('val:')===0){S.exp.vals[key.slice(4)]=t.value;updateAdd();}
    else if(key==='grpName'){S.grp.name=t.value;var b=document.getElementById('create-btn');if(b){var mids=Object.keys(S.grp.members).filter(function(k){return S.grp.members[k];});var ok=S.grp.name.trim()&&mids.length>=2;b.style.background=ok?C.lime:'#dfe7c4';b.style.opacity=ok?1:.6;}}
  });

  render();
})();
</script>
</body>
</html>
